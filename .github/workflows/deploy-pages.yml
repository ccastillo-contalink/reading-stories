name: Publicar cuentos en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Comprobar y compilar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Obtener el proyecto
        uses: actions/checkout@v7.0.1
      - name: Preparar Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci --no-fund --no-audit
      - name: Verificar cuentos y reglas de puntuación
        run: npm test
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v6.0.0
      - name: Compilar la página
        run: npm run build
      - name: Guardar la página para publicación
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
